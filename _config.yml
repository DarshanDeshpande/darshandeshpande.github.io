# ---------------------------------------------------------------
# Site settings — edit freely. Everything the page shows about you
# (other than papers and education, which live in _data/) is here.
# ---------------------------------------------------------------

title: Darshan Deshpande
description: Research Scientist at Patronus AI working on text-based world models for agentic RL, cognitively inspired memory and retrieval, and agent evaluation.
url: "https://darshandeshpande.github.io"
baseurl: ""
lang: en

author:
  name: Darshan Deshpande
  # Used to bold your name in author lists. Add any variants that appear in your papers.
  name_variants: ["Darshan Deshpande", "D. Deshpande", "D Deshpande", "DG Deshpande"]
  role: Research Scientist
  affiliation: Patronus AI
  affiliation_url: https://www.patronus.ai
  location: San Francisco
  # Shown as plain text (not a clickable link) so scrapers are less likely to pick it up.
  email: "darshan [dot] g [dot] deshpande [at] gmail [dot] com"

  # Shown as a small print clipped to the letter. Remove the file to hide it.
  photo: /assets/img/photo.jpg

  # Drop your résumé at this path and a "CV" tab appears.
  cv: /assets/cv.pdf

# The bio is in index.md; the "Re:" line is in _data/about.yml.

# Tabs in the top bar (after "About"), in order. `encl` is the letter
# used for the "Enclosure A / B" label on that page.
nav:
  - label: Publications
    url: /publications/
    encl: A
  - label: Talks
    url: /talks/
    encl: B

# Hills labelled on the contour map behind the page. Positions are
# fractions of the browser window (0 to 1), north up; keep them in the
# side margins so the letter doesn't cover them. Labels only show on
# screens wide enough to have margins.
#   side: which side of the peak the label sits on (left or right).
#   height: relative height of the hill drawn under it.
#   note: optional small line under the name.
landmarks:
  - name: Twin Peaks
    x: 0.12
    y: 0.34
    side: left
    height: 0.95
  - name: Mt Davidson
    note: 928 ft
    x: 0.13
    y: 0.68
    side: left
    height: 1.0
  - name: Bernal Heights
    x: 0.86
    y: 0.52
    side: right
    height: 0.6

# Profile links, in order. Remove or reorder as you like.
links:
  - label: Google Scholar
    url: https://scholar.google.com/citations?user=Zsk97sEAAAAJ
  - label: GitHub
    url: https://github.com/darshandeshpande
  - label: X
    url: https://x.com/getdarshan
  - label: LinkedIn
    url: https://www.linkedin.com/in/darshan-deshpande/

# ---------------------------------------------------------------
# Build settings — you shouldn't need to touch these.
# ---------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["lsquo", "rsquo", "ldquo", "rdquo"]
permalink: pretty
timezone: America/Los_Angeles

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - publish.sh
  - vendor
  - .bundle
