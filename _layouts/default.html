<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF9F5">

  <meta property="og:type" content="{% if page.url == '/' %}profile{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Tiro+Devanagari+Marathi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body{% if page.url != "/" %} class="is-encl"{% endif %}>
  {% include map.html %}
  {% include topbar.html %}
  <main class="sheet" id="content" tabindex="-1">
    {%- if page.url != "/" %}
    <p class="eyebrow">Enclosure {{ page.encl }}</p>
    <h1 class="encl-title">{{ page.title }}</h1>
    {%- endif %}
    {{ content }}
    <footer class="footer">
      <p>Written in San Francisco; the map behind this page sketches its hills. Last updated {{ site.time | date: "%-d %B %Y" }}.</p>
    </footer>
  </main>
</body>
</html>
